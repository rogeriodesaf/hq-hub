services:
  - type: web
    name: hqhub-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist/frontend/browser
    domains:
      - hqhub.space
    routes:
      - type: rewrite
        source: /guia-de-leitura/ordem-de-leitura-mutante
        destination: /guia-xmen-compartilhar.html
      - type: rewrite
        source: /api/*
        destination: https://hqhub-backend.onrender.com/api/*
      - type: rewrite
        source: /classificados/anuncio/*
        destination: https://hqhub-backend.onrender.com/api/compartilhar/anuncios/*
      - type: rewrite
        source: /*
        destination: /index.html
